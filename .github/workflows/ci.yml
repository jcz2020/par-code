name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0
          dune-cache: true
          cache-prefix: v3-par069
      # PAR SDK is not yet on the public opam repo — pin it from source.
      # Tolerate exit code 31: opam returns it when the pin succeeds but
      # switch state metadata is "out of sync" (packages are actually
      # installed and usable). Intermittent on fresh runners without cache.
      - name: Pin PAR SDK
        run: |
          opam pin add par https://github.com/jcz2020/par.git -y || rc=$?
          if [ -n "${rc:-}" ] && [ "$rc" -ne 31 ]; then exit "$rc"; fi
      - name: Install dependencies
        run: opam install . --deps-only --with-test
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune runtest
      - name: Install tmux (Linux)
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          fi
        if: runner.os == 'Linux'
      - name: Integration tests
        run: bash test/integration/run.sh
        if: runner.os == 'Linux'
