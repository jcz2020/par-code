name: CI

on:
  push:
    branches: [main]
    # Documentation-only pushes cannot break the build.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# A superseded run on the same branch is wasted; cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request gets one fast Linux gate; the full platform matrix runs
        # once on main after the merge, so the merged artifact is what gets the
        # expensive arm64/macOS verification.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04-arm"]' || '["ubuntu-22.04","ubuntu-24.04-arm","macos-15"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0
          dune-cache: true
          cache-prefix: v3-par069
      # PAR SDK is not yet on the public opam repo — pin it from source.
      # Pinned to a release tag, not the branch tip: a branch-tip pin makes
      # every build depend on whatever upstream's main happens to contain.
      # happened to be, so the same par-code tag could build two different
      # binaries — and an upstream change with a new required record field
      # breaks the build with no par-code change involved.
      # Tolerate exit code 31: opam returns it when the pin succeeds but
      # switch state metadata is "out of sync" (packages are actually
      # installed and usable). Intermittent on fresh runners without cache.
      - name: Pin PAR SDK
        run: |
          opam pin add par https://github.com/jcz2020/par.git#v0.18.0-beta.20261122 -y || rc=$?
          if [ -n "${rc:-}" ] && [ "$rc" -ne 31 ]; then exit "$rc"; fi
      - name: Install dependencies
        run: opam install . --deps-only --with-test
      - name: Build
        run: opam exec -- dune build
      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.os }}
          path: _build/default/bin/main.exe
          retention-days: 1
      - name: Test
        run: opam exec -- dune runtest
      - name: Install tmux (Linux)
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          fi
        if: runner.os == 'Linux'
      - name: Integration tests
        run: bash test/integration/run.sh
        if: runner.os == 'Linux'
